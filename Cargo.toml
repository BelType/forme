[package]
name = "forme"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A PDF 2.0 writer that reads Caster's display list, and nothing else."
license = "MIT"
repository = "https://codeberg.org/BelType/forme"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdf-writer = "=0.15.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip", "raw_value"] }
sha2 = "=0.11.1"
subsetter = "=0.2.6"
skrifa = "=0.42.1"
flate2 = "=1.1.10"

# The readers the gate asks of the file, never linked into the writer: a PDF parser that is not pdf-writer, so a test reads the file as a reader would.
[dev-dependencies]
hayro-syntax = { version = "=0.7.2", default-features = false, features = ["std"] }

# The module's size is measured under this profile: `cargo rustc --lib --profile wasm --target wasm32-unknown-unknown --crate-type cdylib`. cargo performs no LTO on a library whose crate types include `rlib`, so `cargo build --lib` builds the module without it.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# skrifa and write-fonts are forme's copies of 0.42.1 and 0.48.1 under vendor/, changed so code forme never runs does not link (NOTICE says what changed and why).
[patch.crates-io]
skrifa = { path = "vendor/skrifa" }
write-fonts = { path = "vendor/write-fonts" }
